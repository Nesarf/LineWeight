[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lineweight"
version = "0.1.0"
description = "Line-art projects for painting applications, drawn by an agent: a pressure model, per-stroke width and edge profiles, and every target measured against real artwork"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["lineart", "drawing", "illustration", "pressure", "brush", "painting", "psd", "clip-studio", "svg", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Vector",
]

[project.optional-dependencies]
fit = ["pillow>=9"]
dev = ["pytest>=7"]
# The independent referee (`--audit`, `--judge`) rasterises with cairo, which has never heard of this library. That is
# the whole reason it is a separate extra: the renderer that ships is `raster.py`, in pure Python, and a check that
# shares code with its subject is not a check. `import lineweight` pulls in nothing but the standard library either way.
audit = ["pycairo>=1.20"]

[project.scripts]
lineweight = "lineweight.core:main"

[tool.setuptools]
packages = ["lineweight"]
